name: Build and push container images

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare-matrix:
    name: Find container folders
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.get-dirs.outputs.dirs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find container folders that changed
        id: get-dirs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Build everything on manual runs, new branches, or when the workflow itself changes;
          # otherwise only top-level folders with a Dockerfile that have changes.
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="ALL"
          else
            changed=$(git diff --name-only "$base"...HEAD)
            if echo "$changed" | grep -q '^\.github/workflows/'; then changed="ALL"; fi
          fi
          echo "Changed files:"; echo "$changed"
          CHANGED="$changed" python3 - <<'PY' > dirs.json
          import os, json
          excluded = {'.git', '.github'}
          dirs = sorted(d for d in os.listdir('.') if os.path.isdir(d) and d not in excluded and os.path.exists(os.path.join(d, 'Dockerfile')))
          changed = os.environ["CHANGED"]
          if changed != "ALL":
              touched = {f.split('/', 1)[0] for f in changed.splitlines() if '/' in f}
              dirs = [d for d in dirs if d in touched]
          print(json.dumps(dirs))
          PY
          echo "Building: $(cat dirs.json)"
          echo "dirs=$(cat dirs.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (and push on main) containers
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.dirs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.prepare-matrix.outputs.dirs) }}

    steps:
      - name: Skip if directory name is empty
        if: ${{ matrix.dir == '' }}
        run: echo "Skipping empty matrix entry."

      - name: Checkout
        if: ${{ matrix.dir != '' }}
        uses: actions/checkout@v7

      - name: Set up QEMU (for multi-platform builds)
        if: ${{ matrix.dir != '' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ matrix.dir != '' }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ matrix.dir != '' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY@L}" >> $GITHUB_ENV

      # Optional version tag: a Dockerfile with a top-level `ARG VERSION=x`
      # (e.g. the upstream release it packages) is also tagged :x, so
      # deployments can pin something meaningful and Renovate can follow it.
      - name: Version tag from Dockerfile
        id: version
        if: ${{ matrix.dir != '' }}
        run: |
          v=$(sed -nE 's/^ARG VERSION=([^[:space:]]+).*/\1/p' "${{ matrix.dir }}/Dockerfile" | head -1)
          if [ -n "$v" ]; then
            echo "tag=ghcr.io/${REPO}/${{ matrix.dir }}:${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: ${{ matrix.dir != '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.dir }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/${{ matrix.dir }}:latest
            ${{ steps.version.outputs.tag }}
