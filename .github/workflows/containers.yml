name: Build and push container images

on:
  push:
    branches:
      - main
      - "releases/**"
      - "*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prepare-matrix:
    name: Find container folders
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.get-dirs.outputs.dirs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get list of top-level folders that contain a Dockerfile
        id: get-dirs
        run: |
          python3 - <<'PY' > dirs.json
          import os, json
          excluded = {'.git', '.github'}
          dirs = sorted([d for d in os.listdir('.') if os.path.isdir(d) and d not in excluded and os.path.exists(os.path.join(d, 'Dockerfile'))])
          print(json.dumps(dirs))
          PY
          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          cat dirs.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    name: Build (and push on main) containers
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.prepare-matrix.outputs.dirs) }}

    steps:
      - name: Skip if directory name is empty
        if: ${{ matrix.dir == '' }}
        run: echo "Skipping empty matrix entry."

      - name: Checkout
        if: ${{ matrix.dir != '' }}
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        if: ${{ matrix.dir != '' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ matrix.dir != '' }}
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        if: ${{ matrix.dir != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: ${{ matrix.dir != '' }}
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.dir }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.dir }}:latest
